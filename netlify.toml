[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# L adresse Netlify d origine renvoie desormais vers le domaine officiel.
# Sans cette regle, le site repondait a l identique sur deux adresses : du
# contenu duplique, et des liens entrants qui ne profitaient pas au domaine.
# Cette redirection doit rester AVANT les reecritures d URL ci-dessous.
[[redirects]]
  from = "https://top-carrelage-bailleul.netlify.app/*"
  to = "https://topamenagement.fr/:splat"
  status = 301
  force = true

# Anciennes adresses du site Regicom, encore indexees par Google.
# /top-carrelage, /top-sanitaire et /top-parquets ne redirigent plus : ce sont
# desormais de vraies pages, une par enseigne. Une page qui repond vaut mieux
# qu une redirection, et c est la seule facon d exister sur la recherche du
# nom d enseigne lui-meme. Seuls les sous-chemins restent rediriges.
#
# force = true est indispensable ici : sans lui Netlify cherche d abord un
# fichier statique pour /top-carrelage/quelque-chose, n en trouve pas, et
# sert la page 404 sans jamais atteindre la regle. Verifie en ligne.
[[redirects]]
  from = "/top-carrelage/*"
  to = "/top-carrelage"
  status = 301
  force = true

[[redirects]]
  from = "/top-sanitaire/*"
  to = "/top-sanitaire"
  status = 301
  force = true

[[redirects]]
  from = "/top-parquets/*"
  to = "/top-parquets"
  status = 301
  force = true

# Redirects sans extension .html
