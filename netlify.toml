[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# L adresse Netlify d origine renvoie desormais vers le domaine officiel.
# Sans cette regle, le site repondait a l identique sur deux adresses : du
# contenu duplique, et des liens entrants qui ne profitaient pas au domaine.
# Cette redirection doit rester AVANT les reecritures d URL ci-dessous.
[[redirects]]
  from = "https://top-carrelage-bailleul.netlify.app/*"
  to = "https://topamenagement.fr/:splat"
  status = 301
  force = true

# Anciennes adresses du site Regicom, encore indexees par Google.
# /top-carrelage, /top-sanitaire et /top-parquets ne redirigent plus : ce sont
# desormais de vraies pages, une par enseigne. Une page qui repond vaut mieux
# qu une redirection, et c est la seule facon d exister sur la recherche du
# nom d enseigne lui-meme. Seuls les sous-chemins restent rediriges.
#
# ATTENTION, ces trois regles ne fonctionnent PAS en ligne : /top-carrelage/xxx
# renvoie 404 au lieu de la redirection, avec ou sans force = true (teste le
# 2026-09-30). L explication la plus probable est que la presence du fichier
# top-carrelage.html fait traiter /top-carrelage/ comme un repertoire par le
# serveur de fichiers, avant que les redirections ne soient evaluees.
#
# On les laisse en place car elles ne nuisent pas, et parce que rien ne prouve
# que ces sous-chemins existent vraiment dans l index de Google. Le rapport
# Pages de la Search Console listera les vraies 404 d ici quelques jours : si
# des adresses concretes apparaissent, on ajoutera une regle exacte par
# adresse, ce qui fonctionne de facon certaine.
[[redirects]]
  from = "/top-carrelage/*"
  to = "/top-carrelage"
  status = 301
  force = true

[[redirects]]
  from = "/top-sanitaire/*"
  to = "/top-sanitaire"
  status = 301
  force = true

[[redirects]]
  from = "/top-parquets/*"
  to = "/top-parquets"
  status = 301
  force = true

# Redirects sans extension .html
[[redirects]]
