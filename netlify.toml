[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# L adresse Netlify d origine renvoie desormais vers le domaine officiel.
# Sans cette regle, le site repondait a l identique sur deux adresses : du
# contenu duplique, et des liens entrants qui ne profitaient pas au domaine.
# Cette redirection doit rester AVANT les reecritures d URL ci-dessous.
[[redirects]]
  from = "https://top-carrelage-bailleul.netlify.app/*"
  to = "https://topamenagement.fr/:splat"
  status = 301
  force = true

# Anciennes adresses du site Regicom, encore indexees par Google.
# Sans ces regles elles renvoient une erreur 404 et l anciennete accumulee
# par ces pages est perdue. Une redirection permanente la transfere vers la
# page equivalente du nouveau site.
[[redirects]]
  from = "/top-carrelage"
  to = "/carrelage"
  status = 301

[[redirects]]
  from = "/top-carrelage/*"
  to = "/carrelage"
  status = 301

[[redirects]]
  from = "/top-sanitaire"
  to = "/salle-de-bain"
  status = 301

[[redirects]]
  from = "/top-sanitaire/*"
  to = "/salle-de-bain"
  status = 301

[[redirects]]
  from = "/top-parquets"
  to = "/parquet"
  status = 301

[[redirects]]
  from = "/top-parquets/*"
  to = "/parquet"
  status = 301

# Redirects sans extension .html
